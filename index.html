<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Web Assignment</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        #animatedBox {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            margin: 20px auto;
            position: relative;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Assignment Website</h1>
    <p>Here is one of my favorite YouTube videos:</p>

    <div style="margin: 20px 0;">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="YouTube video player" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen></iframe>
    </div>

    <h2>JavaScript Animation Example</h2>
    <div id="animatedBox"></div>
    <button onclick="startAnimation()" style="padding: 10px 20px; font-size: 14px; cursor: pointer;">Start Animation</button>

    <script>
        function startAnimation() {
            var box = document.getElementById("animatedBox");
            var pos = 0;
            var id = setInterval(frame, 5);
            function frame() {
                if (pos == 200) {
                    clearInterval(id);
                } else {
                    pos++;
                    box.style.top = pos + 'px';
                    box.style.left = pos + 'px';
                }
            }
        }
    </script>

</body>
</html>
